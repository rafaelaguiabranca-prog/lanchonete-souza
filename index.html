    /*************************************************************************

    const DB_NAME = 'LanchoneteSouzaPDV_v1';

        { id: 'cm2', date: new Date().toISOString(), type: 'entrada', category: 'Venda PDV', description: 'Venda #V101 (Consumidor Final)', method: 'Pix', amount: 23.00 },
        { id: 'cm3', date: daysAgoISO(1), type: 'entrada', category: 'Recebimento Fiado', description: 'Pagamento Fiado - João Silva', method: 'Pix', amount: 10.00 }

    let state = null;
    let currentRoute = 'dashboard';
    let cart = [];
    let selectedCategory = 'Todos';
    let productSearch = '';
    let agendaTab = 'atrasadas';
    let fiadoFilter = 'todos';

    function initIndexedDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('app_data')) {
            db.createObjectStore('app_data', { keyPath: 'key' });
          }
        };
        request.onsuccess = (e) => {
          idb = e.target.result;
          resolve(idb);
        };
        request.onerror = () => resolve(null);
      });
    }

    async function loadState() {
      await initIndexedDB();
      let loaded = null;

      if (idb) {
        loaded = await new Promise((resolve) => {
          try {
            const tx = idb.transaction('app_data', 'readonly');
            const req = tx.objectStore('app_data').get('main_state');
            req.onsuccess = () => resolve(req.result ? req.result.value : null);
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
      }

      if (!loaded) {
        try {
          const raw = localStorage.getItem('lanchonete_souza_state_v1');
          if (raw) loaded = JSON.parse(raw);
        } catch (e) {
          console.error('Erro ao ler localStorage', e);
        }
      }

      if (!loaded) {
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        await saveState(true);
      } else {
        state = {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...loaded,
          settings: { ...DEFAULT_STATE.settings, ...(loaded.settings || {}) }
        };
      }
    }

    let syncTimeout = null;
    async function saveState(skipCloud = false) {
      try {
        localStorage.setItem('lanchonete_souza_state_v1', JSON.stringify(state));
      } catch (e) {
        console.warn('LocalStorage indisponível', e);
      }

      if (idb) {
        try {
          const tx = idb.transaction('app_data', 'readwrite');
          tx.objectStore('app_data').put({ key: 'main_state', value: state, updatedAt: new Date().toISOString() });
        } catch (e) {
          console.warn('Erro IndexedDB', e);
        }
      }

      updateSyncIndicator('saved');

      if (!skipCloud && state.settings.supabaseUrl && state.settings.supabaseKey) {
        clearTimeout(syncTimeout);
        syncTimeout = setTimeout(() => {
          pushToSupabase(true);
        }, 1500);
      }
    }

    function updateSyncIndicator(status) {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-label');
      if (!dot || !label) return;

      if (status === 'syncing') {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping inline-block';
        label.textContent = 'Sincronizando nuvem...';
      } else if (status === 'cloud_ok') {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 inline-block';
        label.textContent = 'Nuvem & Local OK';
      } else if (status === 'cloud_err') {
        dot.className = 'w-2 h-2 rounded-full bg-rose-400 inline-block';
        label.textContent = 'Salvo Local (Offline)';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 inline-block';
        label.textContent = state?.settings?.supabaseUrl ? 'Nuvem Configurada' : 'Salvo Automaticamente';
      }
    }

    /*************************************************************************
     * 2. INTEGRAÇÃO OPCIONAL SUPABASE (MULTI-DISPOSITIVO)
     *************************************************************************/
    async function pushToSupabase(silent = false) {
      const url = (state.settings.supabaseUrl || '').trim().replace(/\/$/, '');
      const key = (state.settings.supabaseKey || '').trim();
      if (!url || !key) {
        if (!silent) showToast('Informe a URL e Anon Key do Supabase primeiro.', 'warning');
        return;
      }

      updateSyncIndicator('syncing');
      try {
        const response = await fetch(`${url}/rest/v1/pdv_backups?on_conflict=id`, {
          method: 'POST',
          headers: {
            'apikey': key,
            'Authorization': `Bearer ${key}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify({
            id: 'lanchonete_souza',
            payload: state,
            updated_at: new Date().toISOString()
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        updateSyncIndicator('cloud_ok');
        if (!silent) showToast('Dados sincronizados com a nuvem Supabase!', 'success');
      } catch (err) {
        updateSyncIndicator('cloud_err');
        if (!silent) showToast('Erro ao enviar para Supabase. Verifique a URL/Chave ou a tabela pdv_backups.', 'error');
      }
    }

    async function pullFromSupabase() {
      const url = (state.settings.supabaseUrl || '').trim().replace(/\/$/, '');
      const key = (state.settings.supabaseKey || '').trim();
      if (!url || !key) {
        showToast('Informe a URL e Anon Key do Supabase primeiro.', 'warning');
        return;
      }

      updateSyncIndicator('syncing');
      try {
        const response = await fetch(`${url}/rest/v1/pdv_backups?id=eq.lanchonete_souza&select=payload`, {
          headers: {
            'apikey': key,
            'Authorization': `Bearer ${key}`
          }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const rows = await response.json();
        if (!rows || rows.length === 0 || !rows[0].payload) {
          showToast('Nenhum backup encontrado na nuvem ainda.', 'warning');
          updateSyncIndicator('saved');
          return;
        }
        const currentUrl = state.settings.supabaseUrl;
        const currentKey = state.settings.supabaseKey;
        state = rows[0].payload;
        state.settings.supabaseUrl = currentUrl;
        state.settings.supabaseKey = currentKey;
        await saveState(true);
        updateSyncIndicator('cloud_ok');
        applyBrandHeader();
        renderCurrentPage();
        showToast('Dados baixados da nuvem com sucesso!', 'success');
      } catch (err) {
        updateSyncIndicator('cloud_err');
        showToast('Erro ao baixar dados do Supabase.', 'error');
      }
    }

    /*************************************************************************
     * 3. UTILITÁRIOS, FORMATAÇÃO E CÁLCULOS FINANCEIROS
     *************************************************************************/
    function formatBRL(val) {
      const num = Number(val) || 0;
      return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatDateBR(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr.length === 10 ? isoStr + 'T12:00:00' : isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString('pt-BR');
    }

    function formatDateTimeBR(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function generateId(prefix = 'id') {
      return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function copyTextFallback(text) {
      const el = document.createElement('textarea');
      el.value = text;
      el.setAttribute('readonly', '');
      el.style.position = 'absolute';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select();
      try {
        document.execCommand('copy');
        showToast('Copiado com sucesso!', 'success');
      } catch {
        showToast('Não foi possível copiar automaticamente.', 'warning');
      }
      document.body.removeChild(el);
    }

    function getCustomerSummary(customer) {
      let totalPurchases = 0;
      let totalPayments = 0;
      const allItems = [];
      const payments = [];
      let firstDate = null;
      let lastDate = null;

      (customer.ledger || []).forEach(entry => {
        const dStr = entry.date;
        if (!firstDate || dStr < firstDate) firstDate = dStr;
        if (!lastDate || dStr > lastDate) lastDate = dStr;

        if (entry.type === 'purchase') {
          totalPurchases += Number(entry.total) || 0;
          (entry.items || []).forEach(it => {
            allItems.push({
              date: entry.date,
              name: it.name,
              qty: Number(it.qty) || 1,
              unitPrice: Number(it.unitPrice) || 0,
              total: Number(it.total) || 0
            });
          });
        } else if (entry.type === 'payment') {
          totalPayments += Number(entry.amount) || 0;
          payments.push(entry);
        }
      });

      const balance = Math.max(0, Number((totalPurchases - totalPayments).toFixed(2)));
      return {
        totalPurchases: Number(totalPurchases.toFixed(2)),
        totalPayments: Number(totalPayments.toFixed(2)),
        balance,
        allItems,
        payments,
        firstDate,
        lastDate
      };
    }

    function getDueStatus(customer) {
      const { balance } = getCustomerSummary(customer);
      if (balance <= 0.009) return 'quitado';
      if (!customer.dueDate) return 'sem_data';
      const today = todayISO();
      if (customer.dueDate < today) return 'atrasada';
      if (customer.dueDate === today) return 'hoje';
      return 'futura';
    }

    function openWhatsApp(phone, message) {
      const cleanPhone = String(phone || '').replace(/\D/g, '');
      const fullPhone = cleanPhone.startsWith('55') ? cleanPhone : (cleanPhone.length >= 10 ? '55' + cleanPhone : cleanPhone);
      const url = fullPhone
        ? `https://wa.me/${fullPhone}?text=${encodeURIComponent(message)}`
        : `https://wa.me/?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-rose-600 text-white border-rose-700',
        warning: 'bg-amber-500 text-white border-amber-600',
        info: 'bg-brand-900 text-white border-brand-800'
      };
      const icons = { success: '✅', error: '⚠️', warning: '🔔', info: 'ℹ️' };
      toast.className = `${colors[type] || colors.info} pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border text-sm font-semibold flex items-center gap-2.5 transform transition-all duration-300`;
      toast.innerHTML = `<span class="text-base">${icons[type] || 'ℹ️'}</span><span class="flex-1">${escapeHTML(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3400);
    }

    function openModal(title, htmlContent, maxWidthClass = 'max-w-lg') {
      const modal = document.getElementById('app-modal');
      const box = document.getElementById('app-modal-box');
      box.className = `bg-white w-full ${maxWidthClass} rounded-2xl shadow-2xl border border-orange-200 overflow-hidden my-auto transform transition-all`;
      document.getElementById('app-modal-title').textContent = title;
      document.getElementById('app-modal-body').innerHTML = htmlContent;
      modal.classList.remove('hidden');

    /*************************************************************************
     * 4. IMPRESSÃO TÉRMICA (58mm / 80mm / A4) & WEB BLUETOOTH ESC/POS
     *************************************************************************/
    async function connectBluetoothPrinter() {
      if (!navigator.bluetooth) {
        showToast('Este navegador não suporta Bluetooth direto. Use o botão Imprimir (58mm/80mm/PDF).', 'warning');
        return;
      }
      try {
        showToast('Procurando impressora térmica Bluetooth...', 'info');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
        });
        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();
        for (const service of services) {
          const chars = await service.getCharacteristics();
          for (const char of chars) {
            if (char.properties.write || char.properties.writeWithoutResponse) {
              btCharacteristic = char;
              break;
            }
          }
          if (btCharacteristic) break;
        }
        if (btCharacteristic) {
          const btn = document.getElementById('bt-status-btn');
          if (btn) {
            btn.textContent = 'BT Conectado ✓';
            btn.classList.replace('bg-brand-800', 'bg-emerald-600');
          }
          showToast(`Impressora "${device.name || 'Térmica'}" conectada!`, 'success');
        } else {
          showToast('Dispositivo pareado, mas canal ESC/POS não encontrado. Use impressão padrão.', 'warning');
        }
      } catch (err) {
        showToast('Conexão Bluetooth cancelada ou indisponível.', 'info');
      }
    }

    async function sendRawTextToBluetooth(plainText) {
      if (!btCharacteristic) return false;
      try {
        const normalized = plainText.normalize('NFD').replace(/[\u0300-\u036f]/g, '') + '\n\n\n';
        const encoder = new TextEncoder();
        const data = encoder.encode(normalized);
        for (let i = 0; i < data.length; i += 100) {
          const chunk = data.slice(i, i + 100);
          await btCharacteristic.writeValue(chunk);
        }
        showToast('Impresso na impressora Bluetooth!', 'success');
        return true;
      } catch (e) {
        btCharacteristic = null;
        return false;
      }
    }

    async function printDocument(htmlContent, plainTextForBT = '', widthOverride = null) {
      const width = widthOverride || state.settings.printerWidth || '58mm';
      if (btCharacteristic && plainTextForBT) {
        const sent = await sendRawTextToBluetooth(plainTextForBT);
        if (sent) return;
      }

      const printArea = document.getElementById('print-area');
      const widthClass = width === '80mm' ? 'receipt-80mm' : (width === 'a4' ? 'receipt-a4' : 'receipt-58mm');
      printArea.innerHTML = `<div class="${widthClass} mx-auto text-black">${htmlContent}</div>`;

      setTimeout(() => {
        window.print();
      }, 150);
    }

      currentRoute = route;

      renderCurrentPage();

    function renderCurrentPage() {
      const main = document.getElementById('main-content');
      if (!main) return;
      switch (currentRoute) {
        case 'dashboard': main.innerHTML = renderDashboard(); break;
        case 'vendas': main.innerHTML = renderVendas(); break;
        case 'estoque': main.innerHTML = renderEstoque(); break;
        case 'fiados': main.innerHTML = renderFiados(); break;
        case 'cobrancas': main.innerHTML = renderCobrancas(); break;
        case 'caixa': main.innerHTML = renderCaixa(); break;

                        </div>
                        <div>
                          <span class="text-brand-800/70 block">Venda (Lucro ${margin}%)</span>
                          <strong class="text-sm text-brand-600">${formatBRL(p.sellPrice)}</strong>
                        </div>
                      </div>
                      <div class="mt-3 flex items-center justify-between text-sm">
                        <span>Disponível: <strong class="text-base ${isLow ? 'text-rose-600' : 'text-emerald-700'}">${p.stock} un.</strong></span>
                        <span class="text-xs text-brand-800/70">Mínimo: ${p.minStock} un.</span>
                      </div>
                    </div>

                    <div class="pt-3 border-t border-orange-100 flex flex-wrap gap-2">
                      <button onclick="openStockMovementModal('${p.id}', 'entrada')" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold">
                        + Entrada
                      </button>
                      <button onclick="openStockMovementModal('${p.id}', 'perda')" class="flex-1 py-2.5 px-3 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs font-extrabold">
                        − Perda/Ajuste
                      </button>
                      <button onclick="openProductFormModal('${p.id}')" class="p-2.5 rounded-xl bg-brand-100 hover:bg-brand-200 text-brand-900 text-xs font-bold" title="Editar">
                        ✏️
                      </button>
                      <button onclick="confirmDeleteProduct('${p.id}')" class="p-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold" title="Excluir">
                        🗑️
                      </button>
                    </div>
                  </div>
                `;
              }).join('')
            }
          </div>
        </div>
      `;
    }

    function openProductFormModal(productId = null) {
      const prod = productId ? state.products.find(p => p.id === productId) : null;
      const categories = ['Bebidas', 'Salgados', 'Doces', 'Lanches Prontos', 'Outros'];

      openModal(prod ? 'Editar Produto' : 'Cadastrar Novo Produto', `
        <form onsubmit="saveProductForm(event, '${prod ? prod.id : ''}')" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Nome do Produto *</label>
            <input type="text" id="prod-name" required value="${prod ? escapeHTML(prod.name) : ''}" placeholder="Ex: Refrigerante Lata 350ml"
              class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none font-semibold" />
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Categoria</label>
            <select id="prod-cat" class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none bg-white font-semibold">
              ${categories.map(c => `<option value="${c}" ${prod && prod.category === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Preço de Compra (R$) *</label>
              <input type="number" step="0.01" min="0" id="prod-buy" required value="${prod ? prod.buyPrice : ''}" placeholder="0.00"
                class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none font-bold" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Preço de Venda (R$) *</label>
              <input type="number" step="0.01" min="0" id="prod-sell" required value="${prod ? prod.sellPrice : ''}" placeholder="0.00"
                class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none font-bold text-brand-600" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Quantidade Disponível *</label>
              <input type="number" step="1" min="0" id="prod-stock" required value="${prod ? prod.stock : 0}"
                class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none font-bold" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Estoque Mínimo *</label>
              <input type="number" step="1" min="0" id="prod-min" required value="${prod ? prod.minStock : 5}"
                class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none font-bold" />
            </div>
          </div>

          <div class="pt-2 flex gap-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-sm">Cancelar</button>
            <button type="submit" class="flex-1 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-sm shadow">
              Salvar Produto
            </button>
          </div>
        </form>
      `);
    }

    async function saveProductForm(e, prodId) {
      e.preventDefault();
      const name = document.getElementById('prod-name').value.trim();
      const category = document.getElementById('prod-cat').value;
      const buyPrice = parseFloat(document.getElementById('prod-buy').value) || 0;
      const sellPrice = parseFloat(document.getElementById('prod-sell').value) || 0;
      const stock = parseInt(document.getElementById('prod-stock').value, 10) || 0;
      const minStock = parseInt(document.getElementById('prod-min').value, 10) || 0;

      if (!name) return;

      if (prodId) {
        const idx = state.products.findIndex(p => p.id === prodId);
        if (idx !== -1) {
          state.products[idx] = { ...state.products[idx], name, category, buyPrice, sellPrice, stock, minStock };
        }
        showToast('Produto atualizado com sucesso!', 'success');
      } else {
        const newProd = { id: generateId('p'), name, category, buyPrice, sellPrice, stock, minStock };
        state.products.unshift(newProd);
        if (stock > 0) {
          state.stockLogs.unshift({
            id: generateId('sl'),
            date: new Date().toISOString(),
            productId: newProd.id,
            productName: newProd.name,
            type: 'entrada',
            qty: stock,
            reason: 'Cadastro inicial'
          });
        }
        showToast('Produto cadastrado!', 'success');
      }

      await saveState();
      closeModal();
      renderCurrentPage();
    }

    function openStockMovementModal(productId, type = 'entrada') {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      const isEntry = type === 'entrada';

      openModal(isEntry ? `Entrada de Mercadoria: ${prod.name}` : `Perda / Ajuste de Estoque: ${prod.name}`, `
        <form onsubmit="saveStockMovement(event, '${prod.id}', '${type}')" class="space-y-4">
          <div class="p-3.5 rounded-2xl bg-brand-50 text-sm">
            Estoque atual: <strong>${prod.stock} unidades</strong>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-brand-800 mb-1">
              ${isEntry ? 'Quantidade Recebida (+)' : 'Quantidade de Perda / Saída (−)'} *
            </label>
            <input type="number" min="1" step="1" id="mov-qty" required value="1"
              class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none text-lg font-extrabold" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Motivo / Observação</label>
            <input type="text" id="mov-reason" required value="${isEntry ? 'Reposição de compra' : 'Produto vencido / avariado'}"
              class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none text-sm" />
          </div>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-sm">Cancelar</button>
            <button type="submit" class="flex-1 py-3 rounded-xl ${isEntry ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-amber-600 hover:bg-amber-700'} text-white font-extrabold text-sm">
              Confirmar
            </button>
          </div>
        </form>
      `);
    }

    async function saveStockMovement(e, productId, type) {
      e.preventDefault();
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      const qty = parseInt(document.getElementById('mov-qty').value, 10) || 0;
      const reason = document.getElementById('mov-reason').value.trim();
      if (qty <= 0) return;

      if (type === 'entrada') {
        prod.stock = Number(prod.stock) + qty;
      } else {
        prod.stock = Math.max(0, Number(prod.stock) - qty);
      }

      state.stockLogs.unshift({
        id: generateId('sl'),
        date: new Date().toISOString(),
        productId: prod.id,
        productName: prod.name,
        type,
        qty,
        reason
      });

      await saveState();
      closeModal();
      renderCurrentPage();
      showToast(type === 'entrada' ? `Entrada de +${qty} un. registrada!` : `Baixa de -${qty} un. registrada!`, 'success');
    }

    function confirmDeleteProduct(productId) {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      openModal('Excluir Produto', `
        <div class="space-y-4">
          <p class="text-sm text-brand-900">Tem certeza que deseja excluir <strong>${escapeHTML(prod.name)}</strong>?</p>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-sm">Cancelar</button>
            <button onclick="deleteProduct('${prod.id}')" class="flex-1 py-3 rounded-xl bg-rose-600 text-white font-extrabold text-sm">Excluir</button>
          </div>
        </div>
      `);
    }

    async function deleteProduct(productId) {
      state.products = state.products.filter(p => p.id !== productId);
      await saveState();
      closeModal();
      renderCurrentPage();
      showToast('Produto excluído.', 'info');
    }

    function openStockLogsModal() {
      openModal('Histórico de Movimentações de Estoque', `
        <div class="space-y-2.5">
          ${state.stockLogs.length === 0
            ? '<p class="text-sm text-gray-500">Nenhuma movimentação registrada.</p>'
            : state.stockLogs.slice(0, 40).map(log => `
              <div class="p-3 rounded-2xl border border-orange-100 bg-brand-50/50 flex items-center justify-between gap-2 text-xs">
                <div>
                  <p class="font-bold text-brand-900">${escapeHTML(log.productName)}</p>
                  <p class="text-brand-800/75">${escapeHTML(log.reason)} • ${formatDateTimeBR(log.date)}</p>
                </div>
                <span class="px-2.5 py-1 rounded-full font-extrabold ${
                  log.type === 'entrada' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700'
                }">
                  ${log.type === 'entrada' ? '+' : '-'}${log.qty}
                </span>
              </div>
            `).join('')
          }
        </div>
      `, 'max-w-xl');
    }

    /*************************************************************************
     * 8. TELA 3: FRENTE DE CAIXA (PDV / VENDAS)
     *************************************************************************/
    let saleDiscount = 0;
    let salePaymentMethod = 'Dinheiro';
    let saleCashReceived = '';
    let saleCustomerId = '';
    let saleDueDate = daysAgoISO(-7).slice(0, 10);

    function renderVendas() {
      const categories = ['Todos', ...new Set(state.products.map(p => p.category || 'Outros'))];
      const filtered = state.products.filter(p => {
        const matchCat = selectedCategory === 'Todos' || (p.category || 'Outros') === selectedCategory;
        const matchSearch = p.name.toLowerCase().includes(productSearch.toLowerCase());
        return matchCat && matchSearch;
      });

      const subtotal = cart.reduce((acc, item) => acc + item.qty * item.unitPrice, 0);
      const total = Math.max(0, Number((subtotal - (Number(saleDiscount) || 0)).toFixed(2)));
      const cashReceivedNum = parseFloat(saleCashReceived) || 0;
      const change = salePaymentMethod === 'Dinheiro' && cashReceivedNum > total ? cashReceivedNum - total : 0;

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <!-- Coluna Esquerda: Catálogo de Produtos -->
          <div class="lg:col-span-7 space-y-4">
            <div class="bg-white p-4 rounded-3xl border border-orange-200/80 shadow-xs space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="text-xl font-extrabold text-brand-900">🛒 Frente de Caixa — ${escapeHTML(state.settings.storeName)}</h2>
                <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-brand-100 text-brand-800">Toque para adicionar</span>
              </div>

              <input type="text" value="${escapeHTML(productSearch)}" oninput="productSearch = this.value; renderCurrentPage();"
                placeholder="🔍 Pesquisar salgado, bebida, doce..."
                class="w-full px-4 py-3 rounded-2xl border border-orange-200 focus:border-brand-600 focus:outline-none text-sm font-medium" />

              <!-- Filtros de Categoria -->
              <div class="flex gap-2 overflow-x-auto pb-1">
                ${categories.map(cat => `
                  <button onclick="selectedCategory = '${escapeHTML(cat)}'; renderCurrentPage();"
                    class="px-4 py-2 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${
                      selectedCategory === cat
                        ? 'bg-brand-600 text-white shadow-xs'
                        : 'bg-brand-50 text-brand-800 hover:bg-brand-100'
                    }">
                    ${escapeHTML(cat)}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Grade de Produtos -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
              ${filtered.map(p => {
                const inCart = cart.find(c => c.productId === p.id);
                const outOfStock = Number(p.stock) <= 0;
                return `
                  <button onclick="addToCart('${p.id}')"
                    class="text-left p-4 rounded-3xl border transition active:scale-95 flex flex-col justify-between min-h-[124px] relative ${
                      inCart
                        ? 'bg-brand-50 border-brand-600 ring-2 ring-brand-500/30 shadow-sm'
                        : 'bg-white border-orange-200/80 hover:border-brand-500 shadow-xs'
                    }">
                    ${inCart ? `<span class="absolute top-3 right-3 w-7 h-7 rounded-full bg-brand-600 text-white font-extrabold text-xs flex items-center justify-center shadow">${inCart.qty}</span>` : ''}
                    <div>
                      <span class="text-[10px] font-bold uppercase text-brand-800/65">${escapeHTML(p.category || 'Item')}</span>
                      <p class="font-extrabold text-sm text-brand-900 leading-snug mt-0.5 line-clamp-2">${escapeHTML(p.name)}</p>
                    </div>
                    <div class="mt-3 pt-2 border-t border-orange-100 flex items-end justify-between">
                      <span class="font-extrabold text-base text-brand-600">${formatBRL(p.sellPrice)}</span>
                      <span class="text-[11px] font-bold ${outOfStock ? 'text-rose-600' : 'text-brand-800/70'}">
                        ${outOfStock ? 'Zerado' : p.stock + ' un.'}
                      </span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Coluna Direita: Carrinho e Fechamento -->
          <div class="lg:col-span-5 bg-white p-5 rounded-3xl border border-orange-200 shadow-md space-y-4 lg:sticky lg:top-5">
            <div class="flex items-center justify-between border-b border-orange-100 pb-3">
              <h3 class="font-extrabold text-lg text-brand-900">🧾 Pedido Atual</h3>
              ${cart.length > 0
                ? `<button onclick="clearCart()" class="text-xs font-bold text-rose-600 hover:underline">Limpar</button>`
                : ''
              }
            </div>

            <!-- Itens do Carrinho -->
            <div class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
              ${cart.length === 0
                ? `<div class="py-8 text-center text-brand-800/60 text-sm">Selecione produtos ao lado para iniciar a venda.</div>`
                : cart.map(item => `
                  <div class="p-3 rounded-2xl bg-brand-50/70 border border-orange-100 flex items-center justify-between gap-2">
                    <div class="min-w-0 flex-1">
                      <p class="font-bold text-sm text-brand-900 truncate">${escapeHTML(item.name)}</p>
                      <p class="text-xs text-brand-800/75">${formatBRL(item.unitPrice)} un. • Sub: <strong>${formatBRL(item.qty * item.unitPrice)}</strong></p>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <button onclick="updateCartQty('${item.productId}', -1)" class="w-8 h-8 rounded-xl bg-white border border-orange-200 font-extrabold text-brand-900 hover:bg-orange-100">−</button>
                      <span class="w-7 text-center font-extrabold text-sm">${item.qty}</span>
                      <button onclick="updateCartQty('${item.productId}', 1)" class="w-8 h-8 rounded-xl bg-brand-600 text-white font-extrabold hover:bg-brand-700">+</button>
                    </div>
                  </div>
                `).join('')
              }
            </div>

            <!-- Desconto & Cliente -->
            <div class="space-y-3 pt-2 border-t border-orange-100">
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="block text-[11px] font-bold uppercase text-brand-800 mb-1">Desconto (R$)</label>
                  <input type="number" step="0.50" min="0" value="${saleDiscount || ''}"
                    oninput="saleDiscount = parseFloat(this.value) || 0; renderCurrentPage();"
                    placeholder="0,00"
                    class="w-full px-3 py-2.5 rounded-xl border border-orange-200 text-sm font-bold" />
                </div>
                <div>
                  <label class="block text-[11px] font-bold uppercase text-brand-800 mb-1">Cliente ${salePaymentMethod === 'Fiado' ? '*' : '(Opcional)'}</label>
                  <div class="flex gap-1">
                    <select onchange="saleCustomerId = this.value; renderCurrentPage();"
                      class="w-full px-2.5 py-2.5 rounded-xl border border-orange-200 text-xs font-bold bg-white">
                      <option value="">Consumidor Final</option>
                      ${state.customers.map(c => `<option value="${c.id}" ${saleCustomerId === c.id ? 'selected' : ''}>${escapeHTML(c.name)}</option>`).join('')}
                    </select>
                    <button type="button" onclick="openQuickCustomerModal()" title="Novo Cliente"
                      class="px-3 rounded-xl bg-brand-100 hover:bg-brand-200 text-brand-900 font-extrabold text-sm shrink-0">+</button>
                  </div>
                </div>
              </div>

              <!-- Formas de Pagamento -->
              <div>
                <label class="block text-[11px] font-bold uppercase text-brand-800 mb-1.5">Forma de Pagamento</label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  ${['Dinheiro', 'Pix', 'Cartão', 'Fiado'].map(method => `
                    <button type="button" onclick="salePaymentMethod = '${method}'; renderCurrentPage();"
                      class="py-2.5 px-2 rounded-xl text-xs font-extrabold border transition ${
                        salePaymentMethod === method
                          ? 'bg-brand-900 text-white border-brand-900 shadow-xs'
                          : 'bg-white text-brand-900 border-orange-200 hover:bg-brand-50'
                      }">
                      ${method === 'Dinheiro' ? '💵 Dinheiro' : method === 'Pix' ? '💠 Pix' : method === 'Cartão' ? '💳 Cartão' : '📒 Fiado'}
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- Campos Condicionais por Forma de Pagamento -->
              ${salePaymentMethod === 'Dinheiro' ? `
                <div class="p-3 rounded-2xl bg-emerald-50/80 border border-emerald-200 grid grid-cols-2 gap-3 items-center">
                  <div>
                    <label class="block text-[11px] font-bold uppercase text-emerald-900 mb-1">Valor Recebido (R$)</label>
                    <input type="number" step="0.50" min="0" value="${saleCashReceived}"
                      oninput="saleCashReceived = this.value; renderCurrentPage();"
                      placeholder="${total.toFixed(2)}"
                      class="w-full px-3 py-2 rounded-xl border border-emerald-300 bg-white font-extrabold text-sm" />
                  </div>
                  <div class="text-right">
                    <span class="block text-[11px] font-bold uppercase text-emerald-800">Troco a Devolver</span>
                    <span class="text-xl font-extrabold text-emerald-700">${formatBRL(change)}</span>
                  </div>
                </div>
              ` : ''}

              ${salePaymentMethod === 'Pix' ? `
                <div class="p-3 rounded-2xl bg-sky-50 border border-sky-200 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <span class="block text-[10px] font-bold uppercase text-sky-800">Chave Pix — ${escapeHTML(state.settings.storeName)}</span>
                    <strong class="text-xs font-mono text-sky-950 truncate block">${escapeHTML(state.settings.pixKey || 'Não configurada')}</strong>
                  </div>
                  <button type="button" onclick="copyTextFallback('${escapeHTML(state.settings.pixKey || '')}')"
                    class="px-3 py-2 rounded-xl bg-sky-600 text-white text-xs font-bold shrink-0">
                    Copiar Pix
                  </button>
                </div>
              ` : ''}

              ${salePaymentMethod === 'Fiado' ? `
                <div class="p-3 rounded-2xl bg-amber-50 border border-amber-300 space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <label class="text-xs font-bold text-amber-900">Vencimento da Dívida:</label>
                    <input type="date" value="${saleDueDate}" onchange="saleDueDate = this.value"
                      class="px-3 py-1.5 rounded-xl border border-amber-300 bg-white text-xs font-bold" />
                  </div>
                  ${!saleCustomerId ? `<p class="text-[11px] font-bold text-rose-700">⚠️ Selecione ou cadastre o cliente acima para lançar no fiado.</p>` : ''}
                </div>
              ` : ''}

              <!-- Total e Botão Finalizar -->
              <div class="pt-3 border-t border-orange-200 flex items-center justify-between">
                <div>
                  <span class="text-xs font-bold uppercase text-brand-800/75 block">Total a Pagar</span>
                  <span class="text-2xl font-extrabold text-brand-900">${formatBRL(total)}</span>
                </div>
                <button type="button" onclick="finalizeSale()"
                  class="px-6 py-4 rounded-2xl bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-extrabold text-sm shadow-lg shadow-brand-600/30 transition">
                  ✅ Finalizar Venda
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function addToCart(productId) {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      const existing = cart.find(c => c.productId === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          productId: prod.id,
          name: prod.name,
          unitPrice: Number(prod.sellPrice) || 0,
          qty: 1
        });
      }
      renderCurrentPage();
    }

    function updateCartQty(productId, delta) {
      const idx = cart.findIndex(c => c.productId === productId);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) {
        cart.splice(idx, 1);
      }
      renderCurrentPage();
    }

    function clearCart() {
      cart = [];
      saleDiscount = 0;
      saleCashReceived = '';
      renderCurrentPage();
    }

    async function finalizeSale() {
      if (cart.length === 0) {
        showToast('Adicione pelo menos um produto ao pedido.', 'warning');
        return;
      }

      if (salePaymentMethod === 'Fiado' && !saleCustomerId) {
        showToast('Selecione um cliente para registrar a venda no Fiado.', 'warning');
        return;
      }

      const subtotal = cart.reduce((acc, item) => acc + item.qty * item.unitPrice, 0);
      const discount = Math.min(subtotal, Number(saleDiscount) || 0);
      const total = Number((subtotal - discount).toFixed(2));
      const cashReceivedNum = parseFloat(saleCashReceived) || total;
      const change = salePaymentMethod === 'Dinheiro' && cashReceivedNum > total
        ? Number((cashReceivedNum - total).toFixed(2))
        : 0;

      const customer = saleCustomerId ? state.customers.find(c => c.id === saleCustomerId) : null;
      const saleId = 'V' + String(state.sales.length + 101);
      const nowISO = new Date().toISOString();

      const saleItems = cart.map(c => ({
        productId: c.productId,
        name: c.name,
        qty: c.qty,
        unitPrice: c.unitPrice,
        total: Number((c.qty * c.unitPrice).toFixed(2))
      }));

      // 1. Baixa automática do estoque
      saleItems.forEach(item => {
        const prod = state.products.find(p => p.id === item.productId);
        if (prod) {
          prod.stock = Math.max(0, Number(prod.stock) - item.qty);
        }
      });

      // 2. Registra a venda
      const newSale = {
        id: saleId,
        date: nowISO,
        items: saleItems,
        subtotal: Number(subtotal.toFixed(2)),
        discount,
        total,
        paymentMethod: salePaymentMethod,
        amountPaid: salePaymentMethod === 'Dinheiro' ? cashReceivedNum : total,
        change,
        customerId: customer ? customer.id : '',
        customerName: customer ? customer.name : 'Consumidor Final'
      };
      state.sales.unshift(newSale);

      // 3. Se à vista -> lança no Caixa; Se Fiado -> lança na Caderneta do Cliente
      if (salePaymentMethod === 'Fiado' && customer) {
        customer.ledger = customer.ledger || [];
        customer.ledger.push({
          id: generateId('ldg'),
          type: 'purchase',
          date: nowISO,
          total,
          items: saleItems
        });
        if (saleDueDate) {
          customer.dueDate = saleDueDate;
        }
      } else {
        state.cashMovements.unshift({
          id: generateId('cm'),
          date: nowISO,
          type: 'entrada',
          category: 'Venda PDV',
          description: `Venda #${saleId} (${newSale.customerName})`,
          method: salePaymentMethod,
          amount: total
        });
      }

      // Limpa carrinho e salva
      cart = [];
      saleDiscount = 0;
      saleCashReceived = '';
      await saveState();
      renderCurrentPage();
      showToast(`Venda #${saleId} registrada com sucesso!`, 'success');
      openSaleReceiptModal(saleId);
    }

    async function saveCustomerPayment(e, customerId) {
      e.preventDefault();
      const cust = state.customers.find(c => c.id === customerId);
      if (!cust) return;
      const amount = parseFloat(document.getElementById('pay-amount').value) || 0;
      const method = document.getElementById('pay-method').value;
      const note = document.getElementById('pay-note').value.trim();
      const nextDue = document.getElementById('pay-next-due').value;
      if (amount <= 0) return;

      const nowISO = new Date().toISOString();

      // 1. Registra no histórico imutável do cliente (sem apagar compras anteriores)
      cust.ledger = cust.ledger || [];
      cust.ledger.push({
        id: generateId('pay'),
        type: 'payment',
        date: nowISO,
        amount: Number(amount.toFixed(2)),
        method,
        note: note || `Recebimento via ${method}`
      });

      if (nextDue) cust.dueDate = nextDue;

      // 2. Lança automaticamente no Controle de Caixa (sem duplicar)
      state.cashMovements.unshift({
        id: generateId('cm'),
        date: nowISO,
        type: 'entrada',
        category: 'Recebimento Fiado',
        description: `Recebimento Fiado — ${cust.name}`,
        method,
        amount: Number(amount.toFixed(2))
      });

      await saveState();
      closeModal();
      renderCurrentPage();
      showToast(`Pagamento de ${formatBRL(amount)} registrado e lançado no caixa!`, 'success');
    }

      // Monta texto detalhado para WhatsApp
      const lines = [
        `*${storeName} — EXTRATO DE CONSUMO*`,
        `Cliente: *${cust.name}*`,
        `Período: ${periodText}`,
        cust.dueDate && sum.balance > 0 ? `Vencimento: ${formatDateBR(cust.dueDate)}` : '',
        `--------------------------------`,
        `*PRODUTOS CONSUMIDOS:*`
      ];

      if (sum.allItems.length === 0) {
        lines.push(`Nenhum item registrado.`);
      } else {
        sum.allItems.forEach(it => {
          lines.push(`• ${it.qty}x ${it.name} (${formatBRL(it.unitPrice)} un.) — *${formatBRL(it.total)}* [${formatDateBR(it.date)}]`);
        });
      }

      lines.push(`--------------------------------`);
      lines.push(`Subtotal das Compras: *${formatBRL(sum.totalPurchases)}*`);

      if (sum.payments.length > 0) {
        lines.push(``);
        lines.push(`*PAGAMENTOS REALIZADOS:*`);
        sum.payments.forEach(p => {
          lines.push(`• ${formatDateBR(p.date)} (${p.method}) — *-${formatBRL(p.amount)}*`);
        });
        lines.push(`Total Pago: *${formatBRL(sum.totalPayments)}*`);
      } else {
        lines.push(`Pagamentos Realizados: R$ 0,00`);
      }

      lines.push(`================================`);
      lines.push(`*SALDO DEVEDOR ATUALIZADO: ${formatBRL(sum.balance)}*`);
      lines.push(`================================`);

      if (sum.balance > 0 && st.pixKey) {
        lines.push(`💠 Chave Pix para acerto: *${st.pixKey}*`);
      }
      lines.push(`${st.storeName} agradece!`);

      const whatsappText = lines.filter(l => l !== '').join('\n');

      // Monta HTML comercial para visualização, impressão térmica e PDF
      const htmlDoc = `
        <div class="font-mono text-xs text-black space-y-2.5">
          <div class="text-center border-b border-dashed border-gray-500 pb-2">
            <strong class="text-sm block">${escapeHTML(storeName)}</strong>
            <span class="font-bold">DEMONSTRATIVO DE DÉBITO / EXTRATO</span>
            ${st.phone ? `<div class="text-[11px]">Tel/Whats: ${escapeHTML(st.phone)}</div>` : ''}
          </div>

          <div class="border-b border-dashed border-gray-500 pb-2 space-y-0.5">
            <div><strong>Cliente:</strong> ${escapeHTML(cust.name)}</div>
            ${cust.whatsapp ? `<div><strong>WhatsApp:</strong> ${escapeHTML(cust.whatsapp)}</div>` : ''}
            <div><strong>Período:</strong> ${periodText}</div>
            ${cust.dueDate && sum.balance > 0 ? `<div><strong>Vencimento:</strong> ${formatDateBR(cust.dueDate)}</div>` : ''}
          </div>

          <div class="border-b border-dashed border-gray-500 pb-2">
            <strong class="block mb-1 underline">RELAÇÃO DE PRODUTOS CONSUMIDOS:</strong>
            ${sum.allItems.length === 0
              ? '<p>Nenhum produto lançado.</p>'
              : `<div class="space-y-1">
                  ${sum.allItems.map(it => `
                    <div class="flex justify-between gap-2">
                      <span>${it.qty}x ${escapeHTML(it.name)} (${formatBRL(it.unitPrice)}) <small>[${formatDateBR(it.date)}]</small></span>
                      <span class="font-bold whitespace-nowrap">${formatBRL(it.total)}</span>
                    </div>
                  `).join('')}
                </div>`
            }
          </div>

          <div class="space-y-1 border-b border-dashed border-gray-500 pb-2">
            <div class="flex justify-between font-bold">
              <span>SUBTOTAL COMPRAS:</span>
              <span>${formatBRL(sum.totalPurchases)}</span>
            </div>
            ${sum.payments.length > 0 ? `
              <div class="pt-1">
                <strong class="block underline mb-0.5">PAGAMENTOS REALIZADOS:</strong>
                ${sum.payments.map(p => `
                  <div class="flex justify-between">
                    <span>${formatDateBR(p.date)} (${escapeHTML(p.method)})</span>
                    <span>-${formatBRL(p.amount)}</span>
                  </div>
                `).join('')}
              </div>
              <div class="flex justify-between font-bold">
                <span>TOTAL PAGO:</span>
                <span>-${formatBRL(sum.totalPayments)}</span>
              </div>
            ` : `<div>Pagamentos realizados: R$ 0,00</div>`}
          </div>

          <div class="p-2 border border-black text-center">
            <span class="block text-[11px]">SALDO DEVEDOR ATUALIZADO</span>
            <strong class="text-base">${formatBRL(sum.balance)}</strong>
          </div>

          ${sum.balance > 0 && st.pixKey ? `
            <div class="text-center text-[11px] pt-1">
              Chave Pix: <strong>${escapeHTML(st.pixKey)}</strong>
            </div>
          ` : ''}
        </div>
      `;

      return { cust, sum, whatsappText, htmlDoc };
    }

    async function saveReschedule(e, customerId) {

    /*************************************************************************
     * 11. TELA 7: CONTROLE DE CAIXA & FECHAMENTO DIÁRIO
     *************************************************************************/
    let cashFilterDate = todayISO();

    function renderCaixa() {
      // Saldo total acumulado do caixa
      let totalBalance = 0;
      state.cashMovements.forEach(m => {
        if (m.type === 'entrada') totalBalance += Number(m.amount) || 0;
        else totalBalance -= Number(m.amount) || 0;
      });

      // Movimentações da data filtrada
      const dayMovements = state.cashMovements.filter(m => !cashFilterDate || (m.date || '').slice(0, 10) === cashFilterDate);

      let inDinheiro = 0, inPix = 0, inCartao = 0, totalOut = 0;
      dayMovements.forEach(m => {
        const val = Number(m.amount) || 0;
        if (m.type === 'entrada') {
          if (m.method === 'Dinheiro') inDinheiro += val;
          else if (m.method === 'Pix') inPix += val;
          else if (m.method === 'Cartão') inCartao += val;
        } else {
          totalOut += val;
        }
      });

      return `
        <div class="space-y-5">
          <div class="bg-white p-5 rounded-3xl border border-orange-200/80 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl font-extrabold text-brand-900">💰 Controle de Caixa — ${escapeHTML(state.settings.storeName)}</h2>
              <p class="text-sm text-brand-800/75">Saldo Geral Atual: <strong class="text-emerald-700 text-lg">${formatBRL(totalBalance)}</strong></p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="openCashMovementModal('entrada')" class="px-4 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm">
                + Entrada / Suprimento
              </button>
              <button onclick="openCashMovementModal('saida')" class="px-4 py-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs sm:text-sm">
                − Saída / Despesa
              </button>
              <button onclick="printDailyClosing()" class="px-4 py-3 rounded-2xl bg-brand-900 hover:bg-brand-800 text-white font-extrabold text-xs sm:text-sm">
                🖨️ Fechamento Diário
              </button>
            </div>
          </div>

          <!-- Filtro por Data + Totais por Meio de Pagamento -->
          <div class="bg-white p-5 rounded-3xl border border-orange-200/80 shadow-xs space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h3 class="font-extrabold text-brand-900">Resumo por Forma de Pagamento</h3>
              <div class="flex items-center gap-2">
                <input type="date" value="${cashFilterDate}" onchange="cashFilterDate = this.value; renderCurrentPage();"
                  class="px-3 py-2 rounded-xl border border-orange-200 text-xs font-bold" />
                <button onclick="cashFilterDate = ''; renderCurrentPage();" class="text-xs font-bold text-brand-600 underline">Ver Tudo</button>
              </div>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200">
                <span class="text-xs font-bold text-emerald-900 block">💵 Entradas Dinheiro</span>
                <strong class="text-lg font-extrabold text-emerald-700">${formatBRL(inDinheiro)}</strong>
              </div>
              <div class="p-4 rounded-2xl bg-sky-50 border border-sky-200">
                <span class="text-xs font-bold text-sky-900 block">💠 Entradas Pix</span>
                <strong class="text-lg font-extrabold text-sky-700">${formatBRL(inPix)}</strong>
              </div>
              <div class="p-4 rounded-2xl bg-indigo-50 border border-indigo-200">
                <span class="text-xs font-bold text-indigo-900 block">💳 Entradas Cartão</span>
                <strong class="text-lg font-extrabold text-indigo-700">${formatBRL(inCartao)}</strong>
              </div>
              <div class="p-4 rounded-2xl bg-rose-50 border border-rose-200">
                <span class="text-xs font-bold text-rose-900 block">📤 Saídas / Despesas</span>
                <strong class="text-lg font-extrabold text-rose-700">-${formatBRL(totalOut)}</strong>
              </div>
            </div>
          </div>

          <!-- Lista de Movimentações -->
          <div class="bg-white p-5 rounded-3xl border border-orange-200/80 shadow-xs space-y-3">
            <h3 class="font-extrabold text-brand-900">Movimentações do Caixa (${dayMovements.length})</h3>
            ${dayMovements.length === 0
              ? `<p class="text-sm text-brand-800/70">Nenhuma movimentação encontrada para esta data.</p>`
              : `<div class="divide-y divide-orange-100">
                  ${dayMovements.map(m => `
                    <div class="py-3 flex items-center justify-between gap-3">
                      <div class="min-w-0">
                        <p class="font-bold text-sm text-brand-900 truncate">${escapeHTML(m.description)}</p>
                        <p class="text-xs text-brand-800/70">${escapeHTML(m.category)} • ${escapeHTML(m.method)} • ${formatDateTimeBR(m.date)}</p>
                      </div>
                      <span class="font-extrabold text-sm whitespace-nowrap ${m.type === 'entrada' ? 'text-emerald-700' : 'text-rose-600'}">
                        ${m.type === 'entrada' ? '+' : '-'}${formatBRL(m.amount)}
                      </span>
                    </div>
                  `).join('')}
                </div>`
            }
          </div>
        </div>
      `;
    }

    function openCashMovementModal(type) {
      const isEntry = type === 'entrada';
      openModal(isEntry ? 'Registrar Entrada no Caixa' : 'Registrar Saída / Despesa', `
        <form onsubmit="saveCashMovement(event, '${type}')" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Descrição *</label>
            <input type="text" id="cm-desc" required placeholder="${isEntry ? 'Ex: Reforço de troco' : 'Ex: Compra de refrigerantes / Gás'}"
              class="w-full px-4 py-3 rounded-xl border border-orange-200 font-bold" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Valor (R$) *</label>
              <input type="number" step="0.01" min="0.01" id="cm-amount" required placeholder="0.00"
                class="w-full px-4 py-3 rounded-xl border border-orange-200 font-extrabold text-lg" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Forma de Pagamento</label>
              <select id="cm-method" class="w-full px-4 py-3 rounded-xl border border-orange-200 bg-white font-bold">
                <option value="Dinheiro">💵 Dinheiro</option>
                <option value="Pix">💠 Pix</option>
                <option value="Cartão">💳 Cartão</option>
              </select>
            </div>
          </div>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-sm">Cancelar</button>
            <button type="submit" class="flex-1 py-3 rounded-xl ${isEntry ? 'bg-emerald-600' : 'bg-rose-600'} text-white font-extrabold text-sm">
              Confirmar Lançamento
            </button>
          </div>
        </form>
      `);
    }

    async function saveCashMovement(e, type) {
      e.preventDefault();
      const description = document.getElementById('cm-desc').value.trim();
      const amount = parseFloat(document.getElementById('cm-amount').value) || 0;
      const method = document.getElementById('cm-method').value;
      if (!description || amount <= 0) return;

      state.cashMovements.unshift({
        id: generateId('cm'),
        date: new Date().toISOString(),
        type,
        category: type === 'entrada' ? 'Suprimento Manual' : 'Despesa / Retirada',
        description,
        method,
        amount: Number(amount.toFixed(2))
      });

      await saveState();
      closeModal();
      renderCurrentPage();
      showToast('Movimentação registrada no caixa!', 'success');
    }

    function printDailyClosing() {
      const targetDate = cashFilterDate || todayISO();
      const movs = state.cashMovements.filter(m => (m.date || '').slice(0, 10) === targetDate);
      let din = 0, pix = 0, card = 0, out = 0;
      movs.forEach(m => {
        const v = Number(m.amount) || 0;
        if (m.type === 'entrada') {
          if (m.method === 'Dinheiro') din += v;
          else if (m.method === 'Pix') pix += v;
          else if (m.method === 'Cartão') card += v;
        } else out += v;
      });
      const totalIn = din + pix + card;
      const net = totalIn - out;
      const st = state.settings;

      const html = `
        <div class="font-mono text-xs text-black space-y-2">
          <div class="text-center border-b border-dashed border-gray-500 pb-2">
            <strong class="text-sm block">${escapeHTML(st.storeName).toUpperCase()}</strong>
            <span>FECHAMENTO DE CAIXA</span>
            <div>Data: ${formatDateBR(targetDate)}</div>
          </div>
          <div class="space-y-1 border-b border-dashed border-gray-500 pb-2">
            <div class="flex justify-between"><span>Entradas Dinheiro:</span><span>${formatBRL(din)}</span></div>
            <div class="flex justify-between"><span>Entradas Pix:</span><span>${formatBRL(pix)}</span></div>
            <div class="flex justify-between"><span>Entradas Cartão:</span><span>${formatBRL(card)}</span></div>
            <div class="flex justify-between font-bold"><span>TOTAL ENTRADAS:</span><span>${formatBRL(totalIn)}</span></div>
            <div class="flex justify-between"><span>TOTAL SAÍDAS:</span><span>-${formatBRL(out)}</span></div>
          </div>
          <div class="flex justify-between font-bold text-sm">
            <span>SALDO DO DIA:</span>
            <span>${formatBRL(net)}</span>
          </div>
        </div>
      `;
      const plain = [
        `${st.storeName.toUpperCase()} - FECHAMENTO CAIXA`,
        `Data: ${formatDateBR(targetDate)}`,
        `Dinheiro: ${formatBRL(din)}`,
        `Pix: ${formatBRL(pix)}`,
        `Cartao: ${formatBRL(card)}`,
        `Total Entradas: ${formatBRL(totalIn)}`,
        `Total Saidas: -${formatBRL(out)}`,
        `SALDO DO DIA: ${formatBRL(net)}`
      ].join('\n');

      printDocument(html, plain);
    }

                <h3 class="text-xl font-extrabold mt-2">🚀 Baixar Arquivo para Publicar Online</h3>
                <p class="text-xs text-orange-200/90 mt-1 leading-relaxed">
                  Gera o arquivo único <strong>index.html</strong> limpo e completo, pronto para subir pelo celular ou computador sem precisar configurar servidor.
                </p>
              </div>
              <button onclick="downloadCleanIndexHTML()"
                class="px-5 py-4 rounded-2xl bg-brand-500 hover:bg-brand-600 active:scale-95 text-white font-extrabold text-sm shadow-lg shrink-0 transition">
                ⬇️ Baixar index.html pronto para Vercel / GitHub
              </button>
            </div>
            <div class="bg-brand-900/60 p-4 rounded-2xl border border-brand-700 text-xs text-orange-100 space-y-1.5">
              <p class="font-bold text-orange-300">📱 Passo a passo rápido pelo celular:</p>
              <p>1. Toque no botão laranja acima para baixar o <strong>index.html</strong> na pasta Downloads.</p>
              <p>2. Acesse <strong>github.com</strong> no navegador, crie um repositório (ex: <em>lanchonete-souza</em>) e envie o arquivo <strong>index.html</strong> em <em>"uploading an existing file"</em>.</p>
              <p>3. Acesse <strong>vercel.com</strong>, entre com seu GitHub, toque em <strong>Add New → Project</strong>, selecione o repositório e clique em <strong>Deploy</strong>.</p>
            </div>
          </div>

          <!-- Formulário de Dados da Lanchonete -->
          <form onsubmit="saveSettingsForm(event)" class="bg-white p-5 sm:p-6 rounded-3xl border border-orange-200/80 shadow-xs space-y-4">
            <h3 class="font-extrabold text-lg text-brand-900 border-b border-orange-100 pb-2">🏪 Dados da Lanchonete (Comprovantes e Extratos)</h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Nome da Lanchonete *</label>
                <input type="text" id="cfg-name" required value="${escapeHTML(s.storeName)}"
                  class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none font-bold" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Chave Pix (Vendas e Cobranças)</label>
                <input type="text" id="cfg-pix" value="${escapeHTML(s.pixKey || '')}" placeholder="CPF, CNPJ, Celular ou E-mail"
                  class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none font-semibold" />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Telefone / WhatsApp</label>
                <input type="text" id="cfg-phone" value="${escapeHTML(s.phone || '')}"
                  class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Largura Padrão de Impressão</label>
                <select id="cfg-printer" class="w-full px-4 py-3 rounded-xl border border-orange-200 bg-white font-semibold">
                  <option value="58mm" ${s.printerWidth === '58mm' ? 'selected' : ''}>Térmica 58mm (Bobina Estreita)</option>
                  <option value="80mm" ${s.printerWidth === '80mm' ? 'selected' : ''}>Térmica 80mm (Bobina Larga)</option>
                  <option value="a4" ${s.printerWidth === 'a4' ? 'selected' : ''}>Folha A4 / PDF Comercial</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Endereço Completo</label>
              <input type="text" id="cfg-address" value="${escapeHTML(s.address || '')}"
                class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none" />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
              <div>
                <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Mensagem de Rodapé do Comprovante</label>
                <input type="text" id="cfg-footer" value="${escapeHTML(s.receiptFooter || '')}"
                  class="w-full px-4 py-3 rounded-xl border border-orange-200 focus:border-brand-600 focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Logotipo da Lanchonete</label>
                <input type="file" accept="image/*" onchange="handleLogoUpload(event)"
                  class="w-full text-xs text-brand-800 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-brand-100 file:text-brand-900 hover:file:bg-brand-200" />
              </div>
            </div>

            <div class="pt-2">
              <button type="submit" class="px-6 py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-sm shadow">
                💾 Salvar Configurações
              </button>
            </div>
          </form>

          <!-- Sincronização Nuvem Supabase (Opcional) -->
          <div class="bg-white p-5 sm:p-6 rounded-3xl border border-orange-200/80 shadow-xs space-y-4">
            <div class="flex items-center justify-between border-b border-orange-100 pb-2">
              <h3 class="font-extrabold text-lg text-brand-900">☁️ Sincronização em Nuvem (Supabase Opcional)</h3>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">Multi-aparelho</span>
            </div>
            <p class="text-xs text-brand-800/80 leading-relaxed">
              Se quiser usar o mesmo banco de dados no celular e no computador simultaneamente, crie uma tabela <code class="bg-brand-50 px-1.5 py-0.5 rounded font-mono">pdv_backups (id text primary key, payload jsonb, updated_at timestamptz)</code> no Supabase e cole as chaves abaixo:
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Supabase Project URL</label>
                <input type="url" id="cfg-sb-url" value="${escapeHTML(s.supabaseUrl || '')}" placeholder="https://xyz.supabase.co"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm font-mono" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-brand-800 mb-1">Supabase Anon Public Key</label>
                <input type="password" id="cfg-sb-key" value="${escapeHTML(s.supabaseKey || '')}" placeholder="eyJhbGciOiJIUzI1NiIs..."
                  class="w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm font-mono" />
              </div>
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="saveSupabaseConfig()" class="px-4 py-2.5 rounded-xl bg-brand-900 text-white font-bold text-xs">Salvar Chaves</button>
              <button type="button" onclick="pushToSupabase(false)" class="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs">⬆️ Enviar para Nuvem</button>
              <button type="button" onclick="pullFromSupabase()" class="px-4 py-2.5 rounded-xl bg-sky-600 text-white font-bold text-xs">⬇️ Baixar da Nuvem</button>
            </div>
          </div>

          <!-- Backup e Restauração -->
          <div class="bg-white p-5 sm:p-6 rounded-3xl border border-orange-200/80 shadow-xs space-y-4">
            <h3 class="font-extrabold text-lg text-brand-900 border-b border-orange-100 pb-2">🛡️ Backup e Restauração de Dados</h3>
            <div class="flex flex-wrap gap-3">
              <button onclick="exportBackupJSON()" class="px-5 py-3 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm">
                📥 Exportar Backup (.json)
              </button>
              <label class="px-5 py-3 rounded-2xl bg-brand-100 hover:bg-brand-200 text-brand-900 font-bold text-sm cursor-pointer">
                📤 Restaurar Backup (.json)
                <input type="file" accept=".json" onchange="importBackupJSON(event)" class="hidden" />
              </label>
              <button onclick="loadDemoDataAgain()" class="px-4 py-3 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs">
                🔄 Restaurar Exemplos
              </button>
              <button onclick="resetToCleanState()" class="px-4 py-3 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs ml-auto">
                🧹 Limpar Todos os Dados
              </button>
            </div>
          </div>
        </div>
      `;
    }

    async function saveSettingsForm(e) {
      e.preventDefault();
      state.settings.storeName = document.getElementById('cfg-name').value.trim() || 'Lanchonete Souza';
      state.settings.pixKey = document.getElementById('cfg-pix').value.trim();
      state.settings.phone = document.getElementById('cfg-phone').value.trim();
      state.settings.whatsapp = state.settings.phone.replace(/\D/g, '');
      state.settings.printerWidth = document.getElementById('cfg-printer').value;
      state.settings.address = document.getElementById('cfg-address').value.trim();
      state.settings.receiptFooter = document.getElementById('cfg-footer').value.trim();

      await saveState();
      applyBrandHeader();
      renderCurrentPage();
      showToast('Configurações da Lanchonete Souza salvas!', 'success');
    }

    function handleLogoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        state.settings.logoBase64 = ev.target.result;
        await saveState();
        applyBrandHeader();
        showToast('Logotipo atualizado!', 'success');
      };
      reader.readAsDataURL(file);
    }

    async function saveSupabaseConfig() {
      state.settings.supabaseUrl = document.getElementById('cfg-sb-url').value.trim();
      state.settings.supabaseKey = document.getElementById('cfg-sb-key').value.trim();
      await saveState(true);
      updateSyncIndicator('saved');
      showToast('Chaves do Supabase salvas!', 'success');
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup-lanchonete-souza-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON baixado!', 'success');
    }

    function importBackupJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !parsed.settings || !Array.isArray(parsed.products)) {
            throw new Error('Formato inválido');
          }
          state = parsed;
          await saveState();
          applyBrandHeader();
          renderCurrentPage();
          showToast('Backup restaurado com sucesso!', 'success');
        } catch {
          showToast('Arquivo de backup inválido.', 'error');
        }
      };
      reader.readAsText(file);
    }

    async function loadDemoDataAgain() {
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      await saveState();
      applyBrandHeader();
      renderCurrentPage();
      showToast('Dados de exemplo restaurados!', 'success');
    }

    function resetToCleanState() {
      openModal('Limpar Todos os Dados', `
        <div class="space-y-4">
          <p class="text-sm text-brand-900">Isso apagará vendas, produtos, clientes e movimentações atuais para iniciar do zero na <strong>Lanchonete Souza</strong>. Deseja continuar?</p>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-sm">Cancelar</button>
            <button onclick="executeCleanReset()" class="flex-1 py-3 rounded-xl bg-rose-600 text-white font-extrabold text-sm">Sim, Zerar Tudo</button>
          </div>
        </div>
      `);
    }

    async function executeCleanReset() {
      const keepSettings = { ...state.settings };
      state = {
        settings: keepSettings,
        products: [],
        stockLogs: [],
        customers: [],
        sales: [],
        cashMovements: []
      };
      await saveState();
      closeModal();
      renderCurrentPage();
      showToast('Sistema zerado e pronto para uso real!', 'success');
    }

    // GERA O ARQUIVO INDEX.HTML LIMPO (SEM DUPLICAR O DOM RENDERIZADO) PARA DEPLOY NA VERCEL
    function downloadCleanIndexHTML() {
      try {
        // Clona o documento e restaura os containers dinâmicos ao estado inicial limpo
        const clone = document.documentElement.cloneNode(true);
        const clearIds = ['print-area', 'toast-container', 'desktop-nav', 'mobile-drawer-nav', 'main-content', 'mobile-bottom-nav', 'app-modal-body'];
        clearIds.forEach(id => {
          const el = clone.querySelector('#' + id);
          if (el) el.innerHTML = '';
        });
        const modal = clone.querySelector('#app-modal');
        if (modal) modal.classList.add('hidden');
        const drawer = clone.querySelector('#mobile-drawer');
        if (drawer) drawer.classList.add('hidden');

        const cleanHTML = '<!DOCTYPE html>\n' + clone.outerHTML;
        const blob = new Blob([cleanHTML], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Arquivo index.html limpo baixado! Pronto para subir na Vercel/GitHub.', 'success');
      } catch (err) {
        console.error(err);
        showToast('Erro ao gerar o arquivo index.html.', 'error');
      }
    }

    /*************************************************************************
     * 13. INICIALIZAÇÃO DO SISTEMA
     *************************************************************************/
    window.addEventListener('DOMContentLoaded', async () => {
      await loadState();
      applyBrandHeader();
      renderNavigation();
      renderCurrentPage();
    });
  </script>
</body>
</html>
